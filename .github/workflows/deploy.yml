name: Deploy to Aliyun OSS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 ossutil
        run: |
          set -e
          # 从阿里云官方 GitHub release 下载（比 cdn 直链稳定）
          curl -fL -o ossutil.zip https://github.com/aliyun/ossutil/releases/download/v2.1.1/ossutil-2.1.1-linux-amd64.zip
          unzip -o ossutil.zip
          sudo mv ossutil-2.1.1-linux-amd64/ossutil /usr/local/bin/ossutil
          chmod +x /usr/local/bin/ossutil
          ossutil version

      - name: 同步到 OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -e
          ossutil sync ./ oss://cloudspace-hk1/ \
            --region cn-hongkong \
            --access-key-id "$OSS_ACCESS_KEY_ID" \
            --access-key-secret "$OSS_ACCESS_KEY_SECRET" \
            --delete \
            --force \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.md"