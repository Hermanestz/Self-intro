name: Deploy to Aliyun OSS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 ossutil
        run: |
          set -e
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: 同步到 OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -e
          # v1 语法：先配置 endpoint + AK/SK
          ossutil config -e oss-cn-hongkong.aliyuncs.com \
            -i "$OSS_ACCESS_KEY_ID" \
            -k "$OSS_ACCESS_KEY_SECRET"
          # v1 用 cp -r 递归同步，--delete 删除远端多余文件，-f 免确认
          ossutil cp -r ./ oss://cloudspace-hk1/ \
            --delete -f \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.md"